name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # package-lock.jsonはコミットしていない(Windowsで生成したlockfileだとLinux用の
      # ネイティブバイナリ(rolldown等)を解決できない既知のnpmの問題があるため)。
      # そのためnpmの依存関係キャッシュは使わない。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  php:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: workout_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: workout_test
      DB_USER: root
      DB_PASS: root
      PUBLIC_CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - name: Apply schema and seed data
        run: |
          mysql -h127.0.0.1 -uroot -proot workout_test < sql/schema.sql
          mysql -h127.0.0.1 -uroot -proot workout_test < sql/seed.sql
      - run: composer run lint
      - run: composer run stan
      - run: composer run test

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, php]
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: workout_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
      - run: npm install
      - name: Build dashboard
        run: npm run build --workspace=apps/dashboard
      - name: Apply schema
        run: mysql -h127.0.0.1 -uroot -proot workout_e2e < sql/schema.sql
      - name: Write .env for E2E
        run: |
          cat > php/private/.env <<'EOF'
          DB_HOST=127.0.0.1
          DB_NAME=workout_e2e
          DB_USER=root
          DB_PASS=root
          PUBLIC_CORS_ORIGINS=http://localhost:8000
          APP_BASE_URL=http://localhost:8000
          GOOGLE_CLIENT_ID=
          GOOGLE_CLIENT_SECRET=
          GOOGLE_REDIRECT_URI=http://localhost:8000/api/auth/google_callback.php
          MAIL_FROM=test@example.com
          EOF
      # dev/router.php(README「同一オリジンで動作確認」参照)でビルド済みdistとAPIをまとめて配信する。
      # 本番と同じ同一オリジン構成でないとセッションCookie認証が機能しないため、
      # フロントエンド単独(vite preview等)ではE2Eの意味が無い
      - name: Start app server
        run: nohup php -S localhost:8000 -t apps/dashboard/dist dev/router.php > server.log 2>&1 &
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ > /dev/null && exit 0
            sleep 1
          done
          echo "server did not start in time"; cat server.log; exit 1
      - name: Install Playwright browsers
        working-directory: apps/dashboard
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run e2e --workspace=apps/dashboard
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [frontend, php, e2e]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build dashboard
        run: npm run build --workspace=apps/dashboard

      # デプロイ先は本番ドキュメントルート直下(index.html等)・api/・private/の3系統。
      # dangerous-clean-slateは使わない(ローカルに無いリモートのファイルを消さない)。
      # dashboardの配信元(dist/)にはapi/・private/が含まれないため、この3ステップを
      # 分けて実行してもお互いを消し合うことはない。
      - name: Deploy dashboard
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./apps/dashboard/dist/
          server-dir: ./tamachan-blog.com/public_html/workout/

      - name: Deploy API
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./php/api/
          server-dir: ./tamachan-blog.com/public_html/workout/api/

      # .envは本番の実際の秘密情報が入っており、Gitには無いファイルなので絶対に上書きしない
      - name: Deploy private (excluding .env)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./php/private/
          server-dir: ./tamachan-blog.com/public_html/workout/private/
          exclude: |
            **/.env
