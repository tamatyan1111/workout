name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # package-lock.json はWindows上で生成しているため、npm ciだとLinux用の
      # ネイティブバイナリ(rolldown等)を解決できない既知のnpmの問題がある。
      # npm install ならプラットフォームに応じて正しく解決される。
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  php:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: workout_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: workout_test
      DB_USER: root
      DB_PASS: root
      PUBLIC_CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - name: Apply schema and seed data
        run: |
          mysql -h127.0.0.1 -uroot -proot workout_test < sql/schema.sql
          mysql -h127.0.0.1 -uroot -proot workout_test < sql/seed.sql
      - run: composer run lint
      - run: composer run stan
      - run: composer run test
